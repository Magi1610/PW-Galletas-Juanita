name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          DATE_TAG=$(date +'%y.%m.%d')
          echo "TAG=${DATE_TAG}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg VITE_API_URL='${{ vars.VITE_API_URL }}' \
            -t '${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:'"$TAG" \
            -t '${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:latest' \
            .

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push '${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:'"$TAG"
          docker push '${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:latest'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            docker pull ${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:latest

            docker stop ${{ vars.CONTAINER_NAME }} || true
            docker rm ${{ vars.CONTAINER_NAME }} || true

            docker run -d \
              --name ${{ vars.CONTAINER_NAME }} \
              --restart always \
              -p ${{ vars.VPS_PORT }}:3000 \
              ${{ vars.DOCKER_USER }}/${{ vars.DOCKER_IMAGE }}:latest

            docker image prune -f
